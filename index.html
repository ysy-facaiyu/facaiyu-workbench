<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发财鱼的工作台 🐟</title>
<style>
/* ============ 全局变量 & 重置 ============ */
:root{
  --primary:#0EA5A4;        /* 主色 海洋青 */
  --primary-dark:#0F766E;
  --primary-light:#14B8A6;
  --accent:#F59E0B;         /* 招财橙 点缀 */
  --accent-light:#FBBF24;
  --bg-app:#F0FDFA;         /* 主背景 */
  --bg-sidebar:#0F2A3E;     /* 侧边栏深色 */
  --bg-sidebar-hover:#163B52;
  --bg-card:#FFFFFF;
  --text-dark:#0F2A3E;
  --text-gray:#64748B;
  --text-light:#94A3B8;
  --border:#E2E8F0;
  --success:#10B981;
  --danger:#EF4444;
  --warning:#F59E0B;
  --shadow-sm:0 1px 2px rgba(15,42,62,.06);
  --shadow:0 4px 12px rgba(15,42,62,.08);
  --shadow-lg:0 12px 32px rgba(15,42,62,.12);
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:6px;
  --sidebar-w:240px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla","EmojiOne Color",sans-serif;
  background:var(--bg-app);
  color:var(--text-dark);
  font-size:16px;
  line-height:1.6;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
ul{list-style:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:flex;height:100vh;overflow:hidden}

/* 侧边栏 */
.sidebar{
  width:var(--sidebar-w);
  background:var(--bg-sidebar);
  color:#E2E8F0;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  position:relative;
  z-index:20;
  transition:transform .3s ease;
}
.sidebar-header{
  padding:24px 20px 20px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo-fish{
  font-size:28px;
  line-height:1;
  filter:drop-shadow(0 2px 6px rgba(245,158,11,.4));
  animation:swim 3s ease-in-out infinite;
  display:inline-block;
}
@keyframes swim{
  0%,100%{transform:translateX(0) rotate(-2deg)}
  50%{transform:translateX(4px) rotate(2deg)}
}
.sidebar-title{font-size:19px;font-weight:700;color:#fff;letter-spacing:.5px}
.sidebar-title small{display:block;font-size:13px;font-weight:400;color:var(--primary-light);margin-top:2px}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  color:#CBD5E1;
  font-size:16px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s;
  margin-bottom:4px;
  width:100%;
  text-align:left;
}
.nav-item:hover{background:var(--bg-sidebar-hover);color:#fff}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  color:#fff;
  box-shadow:0 4px 12px rgba(20,184,166,.35);
}
.nav-item .icon{font-size:20px;width:24px;text-align:center}
.sidebar-footer{
  padding:14px 20px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:13px;
  color:#64748B;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.sidebar-footer .cloud-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--success);margin-right:5px;box-shadow:0 0 8px var(--success);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 主内容区 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  background:#fff;
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.menu-toggle{
  display:none;
  font-size:24px;
  color:var(--text-dark);
  padding:4px;
}
.page-title{font-size:22px;font-weight:700;color:var(--text-dark)}
.page-sub{font-size:14px;color:var(--text-gray);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:12px}
.refresh-btn{
  width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,#F0FDFA,#CCFBF1);
  color:var(--primary-dark);
  font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  flex-shrink:0;
  line-height:1;
}
.refresh-btn:hover{background:var(--primary);color:#fff;transform:rotate(180deg)}
.refresh-btn:active{transform:scale(.9)}
.date-chip{
  background:linear-gradient(135deg,#F0FDFA,#CCFBF1);
  color:var(--primary-dark);
  padding:8px 14px;
  border-radius:20px;
  font-size:15px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.date-chip .cal-icon{font-size:16px;line-height:1}
.content{flex:1;overflow-y:auto;padding:24px 28px}
.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============ 通用组件 ============ */
.card{
  background:var(--bg-card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:18px;
  transition:box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  flex-wrap:wrap;
  gap:10px;
}
.card-title{
  font-size:18px;
  font-weight:700;
  color:var(--text-dark);
  display:flex;
  align-items:center;
  gap:8px;
}
.card-title .icon{font-size:20px;line-height:1;display:inline-block}
.nav-item .icon{font-size:20px;width:24px;text-align:center;line-height:1}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:9px 16px;
  border-radius:var(--radius-sm);
  font-size:15px;
  font-weight:600;
  transition:all .2s;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(14,165,164,.35)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#D97706;transform:translateY(-1px)}
.btn-ghost{background:#F1F5F9;color:var(--text-dark)}
.btn-ghost:hover{background:#E2E8F0}
.btn-danger{background:#FEE2E2;color:var(--danger)}
.btn-danger:hover{background:#FECACA}
.btn-sm{padding:6px 12px;font-size:14px}
.btn-icon{
  width:32px;height:32px;padding:0;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#F1F5F9;color:var(--text-gray);font-size:17px;
}
.btn-icon:hover{background:#E2E8F0;color:var(--text-dark)}

.input,.textarea,.select{
  width:100%;
  padding:10px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  background:#fff;
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.input:focus,.textarea:focus,.select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(14,165,164,.12);
}
.textarea{resize:vertical;min-height:80px;line-height:1.6}
.label{display:block;font-size:14px;font-weight:600;color:var(--text-gray);margin-bottom:6px}

/* 标签 */
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
}
.tag-ganhuo{background:#FEF3C7;color:#92400E}
.tag-yanzhi{background:#FCE7F3;color:#9D174D}
.tag-richang{background:#DBEAFE;color:#1E40AF}
.tag-tucao{background:#FEE2E2;color:#991B1B}
.tag-haowu{background:#D1FAE5;color:#065F46}
.tag-hot{background:#FEE2E2;color:#991B1B}
.tag-mid{background:#FEF3C7;color:#92400E}
.tag-low{background:#E0E7FF;color:#3730A3}

/* 进度条 */
.progress-bar{
  height:10px;background:#E2E8F0;border-radius:5px;overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary-light));
  border-radius:5px;
  transition:width .5s ease;
}

/* 待办项 */
.todo-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:#F8FAFC;
  border-radius:var(--radius-sm);
  margin-bottom:8px;
  transition:all .2s;
  border-left:3px solid transparent;
}
.todo-item:hover{background:#F1F5F9;border-left-color:var(--primary-light)}
.todo-item.done{opacity:.55}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light)}
.checkbox{
  width:20px;height:20px;
  border:2px solid var(--border);
  border-radius:6px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:all .2s;
  background:#fff;
}
.checkbox.checked{background:var(--primary);border-color:var(--primary);color:#fff}
.checkbox.checked::after{content:"✓";font-size:15px;font-weight:700}
.todo-text{flex:1;font-size:16px}
.todo-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.todo-item:hover .todo-actions{opacity:1}

/* 空状态 */
.empty{
  text-align:center;
  padding:36px 20px;
  color:var(--text-light);
}
.empty .icon{font-size:42px;display:block;margin-bottom:8px;opacity:.5}

/* 统计数字 */
.stat-row{display:flex;gap:14px;flex-wrap:wrap}
.stat-box{
  flex:1;min-width:120px;
  background:linear-gradient(135deg,#F0FDFA,#CCFBF1);
  border-radius:var(--radius-sm);
  padding:14px 16px;
}
.stat-num{font-size:26px;font-weight:700;color:var(--primary-dark)}
.stat-label{font-size:14px;color:var(--text-gray);margin-top:2px}

/* Toast */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--text-dark);
  color:#fff;
  padding:12px 24px;
  border-radius:30px;
  font-size:15px;
  font-weight:500;
  box-shadow:var(--shadow-lg);
  z-index:1000;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 表格 */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{
  background:#F1F5F9;
  padding:10px 12px;
  text-align:left;
  font-weight:600;
  color:var(--text-gray);
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#F8FAFC}

/* 折叠 */
.collapse-body{display:none;padding-top:12px}
.collapse-body.open{display:block;animation:fade .25s}

/* 遮罩 */
.mask{
  display:none;
  position:fixed;inset:0;
  background:rgba(15,42,62,.5);
  z-index:15;
}
.mask.show{display:block}

/* 响应式 */
@media(max-width:768px){
  :root{--sidebar-w:240px}
  .sidebar{
    position:fixed;left:0;top:0;height:100%;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .page-title{font-size:19px}
  .card{padding:16px}
  .stat-box{min-width:100px}
}

/* 模块特化 */

/* 爆款分析 Tab */
.hot-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.hot-tab{
  padding:8px 16px;border-radius:20px;font-size:15px;font-weight:600;
  background:#F1F5F9;color:var(--text-gray);transition:all .2s;
}
.hot-tab:hover{background:#E2E8F0}
.hot-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 3px 10px rgba(14,165,164,.3)}
.hot-analyzer{background:#F8FAFC;border-radius:12px;padding:14px;margin-bottom:6px}
.analyze-card{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;animation:fade .3s}
.analyze-card .ac-head{padding:12px 14px;background:linear-gradient(135deg,#F0FDFA,#CCFBF1);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.analyze-card .ac-head b{font-size:16px}
.analyze-card .ac-body{padding:12px 14px}
.analyze-dim{margin-bottom:12px}
.analyze-dim:last-child{margin-bottom:0}
.analyze-dim .dim-label{font-size:14px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.analyze-dim .dim-text{font-size:15px;color:var(--text-dark);line-height:1.6}
.hot-video-item{border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.hot-video-item:hover{box-shadow:var(--shadow)}
.hv-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.hv-head:hover{background:#F8FAFC}
.hv-body{display:none;padding:0 14px 14px}
.hv-body.open{display:block;animation:fade .25s}
.hv-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--text-gray);margin-top:6px}
.hv-stats span b{color:var(--text-dark)}
.watermark{
  position:absolute;top:50%;right:20px;transform:translateY(-50%);
  font-size:122px;opacity:.04;pointer-events:none;font-weight:900;
}
.section-title{
  font-size:15px;font-weight:700;color:var(--text-gray);
  text-transform:uppercase;letter-spacing:1px;
  margin:18px 0 10px;display:flex;align-items:center;gap:6px;
}
.section-title:first-child{margin-top:0}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--text-light);font-size:14px}
.pill{
  display:inline-block;padding:2px 10px;border-radius:20px;
  font-size:13px;font-weight:600;background:#F1F5F9;color:var(--text-gray);
}
.pill.green{background:#D1FAE5;color:#065F46}
.pill.orange{background:#FEF3C7;color:#92400E}
.pill.blue{background:#DBEAFE;color:#1E40AF}
/* 本职工作模块 */
.work-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.work-tab{padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:15px;font-weight:600;color:var(--text-gray);cursor:pointer;transition:all .2s}
.work-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.work-tab:hover:not(.active){border-color:var(--primary);color:var(--primary)}
.train-item{padding:14px 16px;background:#F8FAFC;border-radius:12px;margin-bottom:10px;border-left:4px solid var(--primary);transition:all .2s}
.train-item:hover{background:#F1F5F9;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.train-item.expanded{background:#fff;border-left-color:var(--accent)}
.train-highlight{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:15px;line-height:1.6;display:flex;gap:8px;align-items:flex-start}
.flashcard{background:linear-gradient(135deg,#fff,#F8FAFC);border:1.5px solid var(--border);border-radius:14px;padding:18px;margin-bottom:10px;cursor:pointer;transition:all .3s;position:relative;min-height:80px}
.flashcard:hover{box-shadow:var(--shadow)}
.flashcard .fc-q{font-size:15px;font-weight:600;color:var(--text-dark)}
.flashcard .fc-a{font-size:14px;color:var(--text-gray);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:none}
.flashcard.flipped .fc-a{display:block}
.flashcard.flipped .fc-q{color:var(--primary)}
.fc-status{display:flex;gap:6px;margin-top:10px}
.fc-status button{padding:4px 10px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:#fff;cursor:pointer}
.fc-status button.active.mastered{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.fc-status button.active.review{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.fc-status button.active.unsure{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.exam-item{padding:14px 16px;border-radius:12px;margin-bottom:10px;border-left:4px solid var(--primary);transition:all .2s;background:#F8FAFC}
.exam-item.high{border-left-color:#EF4444}
.exam-item.mid{border-left-color:#F59E0B}
.exam-item.low{border-left-color:#6366F1}
.exam-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ocr-loading{display:flex;align-items:center;gap:10px;padding:14px;background:#FEF3C7;border-radius:10px;margin-bottom:10px;font-size:14px;color:#92400E}
.ocr-loading .spinner{width:20px;height:20px;border:2.5px solid #FCD34D;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.import-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px dashed var(--border);background:#fff;color:var(--text-gray);transition:all .2s}
.import-btn:hover{border-color:var(--primary);color:var(--primary);background:#F0FDFA}
</style>
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo-fish">🐟</span>
      <div>
        <div class="sidebar-title">发财鱼工作台</div>
        <small>Fortune Fish Studio</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="plan"><span class="icon">📋</span>每日计划</button>
      <button class="nav-item" data-page="inspire"><span class="icon">💡</span>选题每日灵感</button>
      <button class="nav-item" data-page="hot"><span class="icon">🎬</span>爆款视频分析库</button>
      <button class="nav-item" data-page="launch"><span class="icon">🚀</span>起号计划</button>
      <button class="nav-item" data-page="review"><span class="icon">📊</span>内容复盘</button>
      <button class="nav-item" data-page="moments"><span class="icon">🌍</span>发朋友圈</button>
      <button class="nav-item" data-page="memo"><span class="icon">📝</span>备忘录</button>
      <button class="nav-item" data-page="fitness"><span class="icon">💪</span>健身打卡</button>
      <button class="nav-item" data-page="work"><span class="icon">💼</span>本职工作</button>
    </nav>
    <div class="sidebar-footer">
      <span><span class="cloud-dot"></span>本地已同步</span>
      <span>v1.0</span>
    </div>
  </aside>

  <div class="mask" id="mask"></div>

  <!-- 主内容 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div>
          <div class="page-title" id="pageTitle">每日计划</div>
          <div class="page-sub" id="pageSub">今日待办与周进度</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="refresh-btn" onclick="location.reload()" title="刷新页面">↻</button>
        <div class="date-chip" id="dateChip"><span class="cal-icon" style="font-style:normal">🗓</span><span id="dateChipText">加载中...</span></div>
      </div>
    </header>

    <div class="content" id="content">
      <!-- 各页面动态渲染 -->
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   发财鱼工作台 - 全部逻辑
   ============================================================ */

/* ============ 数据层 ============ */
const Store = {
  get(key, def){
    try{
      const v = localStorage.getItem('facai_'+key);
      return v ? JSON.parse(v) : (def !== undefined ? def : null);
    }catch(e){ return def !== undefined ? def : null; }
  },
  set(key, val){
    localStorage.setItem('facai_'+key, JSON.stringify(val));
  },
  del(key){ localStorage.removeItem('facai_'+key); },
  exportAll(){
    const data = {};
    ['plan_todos','plan_history','inspires','topics','reviews','moments_tasks','moments_lib',
     'memos_notes','memos_accounts','memos_shopping','fitness_records','fitness_body','fitness_diet','work_trainings','work_exams'].forEach(k=>{
      data[k] = Store.get(k, null);
    });
    return data;
  }
};

/* ============ 工具函数 ============ */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayStr = ()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function fmtDate(d){
  const days=['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日 周${days[d.getDay()]}`;
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function download(filename,text){
  const blob=new Blob([text],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  URL.revokeObjectURL(a.href);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ============ 路由 ============ */
const PAGES = {
  plan:    {title:'每日计划', sub:'今日待办与周进度', render:renderPlan},
  inspire: {title:'选题每日灵感', sub:'灵感速记 · 爆款选题库', render:renderInspire},
  hot:     {title:'爆款视频分析库', sub:'拆解爆款 · 借鉴复用', render:renderHot},
  launch:  {title:'起号计划', sub:'双号策略 · 内容日历 · 数据追踪', render:renderLaunch},
  review:  {title:'内容复盘', sub:'作品数据与优化方向', render:renderReview},
  moments: {title:'发朋友圈', sub:'留学中介朋友圈运营', render:renderMoments},
  memo:    {title:'备忘录', sub:'随笔 · 归档 · 清单', render:renderMemo},
  fitness: {title:'健身打卡', sub:'训练记录与身体数据', render:renderFitness},
  work:    {title:'本职工作', sub:'培训学习 · 考核要点 · 记忆闪卡', render:renderWork},
};

function switchPage(key){
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===key));
  const p=PAGES[key];
  $('#pageTitle').textContent=p.title;
  $('#pageSub').textContent=p.sub;
  $('#content').innerHTML = `<div class="page active" id="page"></div>`;
  p.render($('#page'));

  $('#sidebar').classList.remove('open');
  $('#mask').classList.remove('show');

}

/* ============ 日期芯片 ============ */

/* ============ 1. 每日计划 ============ */
function renderPlan(root){
  const todos = Store.get('plan_todos', []);
  const history = Store.get('plan_history', {}); // {date: {total, done}}
  
  // 计算本周完成率
  const now=new Date();
  const weekStats=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const h=history[ds]||{total:0,done:0};
    weekStats.push({date:ds,label:`${d.getMonth()+1}/${d.getDate()}`,...h});
  }
  const weekTotal=weekStats.reduce((s,x)=>s+x.total,0);
  const weekDone=weekStats.reduce((s,x)=>s+x.done,0);
  const weekRate=weekTotal?Math.round(weekDone/weekTotal*100):0;

  root.innerHTML=`
    <div class="grid grid-2">
      <div class="card" style="position:relative">
        <div class="watermark">📋</div>
        <div class="card-header">
          <div class="card-title"><span class="icon">✅</span>今日待办</div>
          <div class="flex">
            <button class="btn btn-ghost btn-sm" onclick="clearDoneTodos()">清理已完成</button>
          </div>
        </div>
        <div class="flex" style="margin-bottom:14px;gap:8px">
          <input class="input" id="todoInput" placeholder="添加一个待办事项，回车快速添加..." onkeydown="if(event.key==='Enter')addTodo()">
          <button class="btn btn-primary" onclick="addTodo()">添加</button>
        </div>
        <div id="todoList"></div>
        <div id="todoEmpty"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="icon">📈</span>本周进度</div>
          <button class="btn btn-accent btn-sm" onclick="syncCloud()">☁️ 同步到云端</button>
        </div>
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px">
          <canvas id="weekRing" width="120" height="120" style="flex-shrink:0"></canvas>
          <div style="flex:1;min-width:0">
            <div class="stat-num" style="font-size:32px;font-weight:700;color:var(--primary-dark);line-height:1.1">${weekDone}<span style="font-size:18px;color:var(--text-gray);font-weight:500"> / ${weekTotal}</span></div>
            <div class="stat-label" style="font-size:15px;color:var(--text-gray);margin-top:6px">本周已完成任务</div>
            <div class="muted" style="margin-top:8px">完成率 <b style="color:var(--primary);font-size:20px">${weekRate}%</b></div>
          </div>
        </div>
        <div class="section-title">每日完成数</div>
        <canvas id="weekBar" width="400" height="120" style="width:100%"></canvas>
      </div>
    </div>
  `;
  renderTodoList();
  drawWeekRing(weekRate);
  drawWeekBar(weekStats);
}
function renderTodoList(){
  const todos=Store.get('plan_todos',[]);
  const list=$('#todoList');if(!list)return;
  if(!todos.length){
    list.innerHTML='';
    $('#todoEmpty').innerHTML=`<div class="empty"><span class="icon">🎯</span>今天还没有待办，添加第一个开始高效一天！</div>`;
    return;
  }
  $('#todoEmpty').innerHTML='';
  list.innerHTML=todos.map(t=>`
    <div class="todo-item ${t.done?'done':''}">
      <div class="checkbox ${t.done?'checked':''}" onclick="toggleTodo('${t.id}')"></div>
      <div class="todo-text">${esc(t.text)}</div>
      <div class="todo-actions">
        <button class="btn-icon" onclick="delTodo('${t.id}')" title="删除">🗑</button>
      </div>
    </div>
  `).join('');
}
function addTodo(){
  const inp=$('#todoInput');const text=inp.value.trim();if(!text)return;
  const todos=Store.get('plan_todos',[]);
  todos.push({id:uid(),text,done:false});
  Store.set('plan_todos',todos);
  inp.value='';
  updatePlanHistory();renderTodoList();drawWeekRing(calcWeekRate());drawWeekBar(getWeekStats());
  toast('已添加待办');
}
function toggleTodo(id){
  const todos=Store.get('plan_todos',[]);
  const t=todos.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  Store.set('plan_todos',todos);
  updatePlanHistory();renderTodoList();drawWeekRing(calcWeekRate());drawWeekBar(getWeekStats());
}
function delTodo(id){
  let todos=Store.get('plan_todos',[]);
  todos=todos.filter(x=>x.id!==id);
  Store.set('plan_todos',todos);
  updatePlanHistory();renderTodoList();drawWeekRing(calcWeekRate());drawWeekBar(getWeekStats());
}
function clearDoneTodos(){
  let todos=Store.get('plan_todos',[]);
  todos=todos.filter(x=>!x.done);
  Store.set('plan_todos',todos);
  updatePlanHistory();renderTodoList();drawWeekRing(calcWeekRate());drawWeekBar(getWeekStats());
  toast('已清理已完成项');
}
function updatePlanHistory(){
  const todos=Store.get('plan_todos',[]);
  const ds=todayStr();
  const history=Store.get('plan_history',{});
  history[ds]={total:todos.length,done:todos.filter(x=>x.done).length};
  Store.set('plan_history',history);
}
function getWeekStats(){
  const now=new Date();const stats=[];
  const history=Store.get('plan_history',{});
  for(let i=6;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const h=history[ds]||{total:0,done:0};
    stats.push({date:ds,label:`${d.getMonth()+1}/${d.getDate()}`,...h});
  }
  return stats;
}
function calcWeekRate(){
  const s=getWeekStats();const t=s.reduce((a,x)=>a+x.total,0);const d=s.reduce((a,x)=>a+x.done,0);
  return t?Math.round(d/t*100):0;
}
function drawWeekRing(pct){
  const c=$('#weekRing');if(!c)return;const ctx=c.getContext('2d');
  ctx.clearRect(0,0,120,120);
  const cx=60,cy=60,r=46;
  ctx.lineWidth=12;lineCap='round';
  // 背景圈
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#E2E8F0';ctx.lineWidth=12;ctx.stroke();
  // 进度
  if(pct>0){
    ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct/100);
    const g=ctx.createLinearGradient(0,0,120,120);
    g.addColorStop(0,'#0EA5A4');g.addColorStop(1,'#14B8A6');
    ctx.strokeStyle=g;ctx.lineCap='round';ctx.stroke();
  }
  ctx.fillStyle='#0F2A3E';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(pct+'%',cx,cy);
  ctx.fillStyle='#94A3B8';ctx.font='11px sans-serif';
  ctx.fillText('完成率',cx,cy+18);
}
function drawWeekBar(stats){
  const c=$('#weekBar');if(!c)return;const ctx=c.getContext('2d');
  const W=c.width=c.offsetWidth*2,H=c.height=240;
  ctx.scale(2,2);const w=W/2;
  ctx.clearRect(0,0,w,H/2);
  const pad=30,barW=(w-pad*2)/7*0.6,gap=(w-pad*2)/7;
  const maxVal=Math.max(1,...stats.map(s=>Math.max(s.total,s.done)));
  const chartH=H/2-50;
  stats.forEach((s,i)=>{
    const x=pad+i*gap+(gap-barW)/2;
    const today=s.date===todayStr();
    // total 底
    const hT=Math.max(2,s.total/maxVal*chartH);
    ctx.fillStyle=today?'#CCFBF1':'#E2E8F0';
    roundRect(ctx,x,30+chartH-hT,barW,hT,4);ctx.fill();
    // done
    const hD=s.done/maxVal*chartH;
    if(hD>0){
      const g=ctx.createLinearGradient(0,30+chartH-hD,0,30+chartH);
      g.addColorStop(0,'#14B8A6');g.addColorStop(1,'#0EA5A4');
      ctx.fillStyle=g;roundRect(ctx,x,30+chartH-hD,barW,hD,4);ctx.fill();
    }
    // label
    ctx.fillStyle=today?'#0EA5A4':'#94A3B8';
    ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(s.label,x+barW/2,30+chartH+16);
    ctx.fillStyle='#0F2A3E';ctx.font='bold 11px sans-serif';
    ctx.fillText(s.done+'/'+s.total,x+barW/2,30+chartH+30);
  });
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function syncCloud(){
  const data=Store.exportAll();
  download(`发财鱼工作台-备份-${todayStr()}.json`,JSON.stringify(data,null,2));
  toast('☁️ 数据已导出备份，可传到手机保存');
}

function hotAnalyze(text){
  const t=text.toLowerCase();
  const len=text.length;
  // 钩子识别
  let hook='通用开头：直接进入主题，建议强化前3秒——可用反差数字/悬念提问/利益承诺/对立冲突中任一种钩子提升完播';
  if(/万|块|月入|一年|只要|只需|花/.test(text)&&/^[0-9一二三四五六七八九两十几]/.test(text.trim())) hook='数字钩子：开头用具体数字(金额/时间/数量)制造冲击，数字越反常识留人越强。建议保留这个数字并放大反差感';
  else if(/后悔|真相|秘密|不会告诉|揭秘|曝光|内幕/.test(text)) hook='悬念/对立钩子：用"后悔/真相/不会告诉"制造信息差期待，让观众觉得"要捡漏了"必须看完。注意后段必须兑现承诺，否则掉粉';
  else if(/vs|对比|第一[天步]vs|以前vs|变化|差距/.test(text)) hook='对比反差钩子：A vs B 自带戏剧张力，观众想看变化/差距，天然留人。建议开头直接抛出对比框架';
  else if(/崩溃|孤独|尴尬|最[难惨]|破防|emo/.test(text)) hook='情绪前置钩子：用强情绪词直接调动共情本能，观众想安慰/猎奇/代入。注意结尾留正向转折避免纯丧';
  else if(/攻略|教程|方法|步骤|怎么做|如何/.test(text)) hook='利益/干货钩子：直接承诺解决问题，观众为"有用"停留。建议开头明确"看完你能得到X"强化利益点';
  else if(/\?|？|为什么|凭什么|凭什么|凭啥/.test(text.slice(0,30))) hook='提问钩子：用问题开场激发好奇，观众为找答案停留。建议问题是目标人群真实困惑';

  // 共情识别
  let empathy='信息价值共鸣：观众因"有用"而收藏转发。建议补充情绪维度——加入焦虑/希望/认同感会显著提升互动';
  if(/焦虑|压力|卷|内卷|怕|担心|纠结|迷茫/.test(text)) empathy='焦虑共鸣：精准戳中目标人群的隐性焦虑(钱/学历/未来)，观众觉得"被说中了"。注意焦虑后必须给希望/解药，否则纯制造焦虑会被反感';
  else if(/想家|孤独|崩溃|emo|没人懂|一个人/.test(text)) empathy='深度共情：戳中留学生的情绪软肋，观众产生"被理解"的强烈共鸣，评论区会变情绪树洞。互动率极高';
  else if(/我也能|原来可以|竟然|居然|没想到/.test(text)) empathy='希望/爽感共鸣：打破认知后给"我也能行"的希望感，观众为这种"获得可能性"而点赞收藏';
  else if(/避坑|被骗|亏了|血泪|教训/.test(text)) empathy='被坑恐惧共鸣：戳中"怕踩坑怕被坑"的普遍心理，观众为"自保"而看完+收藏';
  else if(/我们都|每个留学生|谁懂|是不是/.test(text)) empathy='身份认同共鸣：用"我们"建立群体归属感，观众因"这就是我"而互动';

  // 结构识别
  let structure='建议结构：3秒钩子 → 15秒背景/痛点 → 30秒核心内容(分点) → 10秒行动号召。当前文案偏平铺，建议拆成清晰节奏点';
  if(len<100) structure='短文案(偏金句/口播)：结构紧凑是优势。建议黄金3秒钩子→20秒核心观点→5秒金句收尾，适合做情绪/观点类爆款';
  else if(/首先|第一|其次|然后|最后|1\.|2\.|3\.|第一步|第二步/.test(text)) structure='分点结构：已用"第一/其次/步骤"分层，节奏清晰是爆款基础。建议每个分点前加小标题或转场，增强视觉节奏';
  if(/但是|然而|可是|没想到|结果/.test(text)) structure+='；含转折点(但是/结果)，这是留人关键，建议转折处配视觉/语气强化';
  if(/收藏|关注|点赞|评论|留言|主页/.test(text)) structure+='；结尾有行动号召(收藏/关注)，注意号召要具体——"评论你的X"比"关注我"互动率高3倍';

  // 借鉴点
  let reuse='可复用模板：把这条视频的钩子句式 + 结构框架 套到你的垂直领域。建议立刻拆出"开头句式"和"结尾号召句式"做成你自己的爆款模板库';
  if(/万|块|一年|月入/.test(text)) reuse='数字反差是万能公式：把视频里的"X万/X年"换成你领域的反差数字做系列——每个数字都是一条新选题';
  if(/vs|对比|第一[天步]/.test(text)) reuse+='；对比框架可无限套用：A vs B 做成系列，每期换一对对比维度'
  if(/后悔|真相|不会告诉|避坑/.test(text)) reuse+='；"X不会告诉你/避坑"句式可垂直化——选校避坑/文书避坑/签证避坑，每个环节都是一个爆款选题';

  return {hook,empathy,structure,reuse};
}

function saveHotAnalysis(title,cat){
  if(!window._lastHotAnalysis){toast('没有可保存的分析');return;}
  const a=window._lastHotAnalysis;
  const videos=Store.get('hot_videos',[]);
  videos.push({id:uid(),cat,title:title||a.title,hook:a.hook,empathy:a.empathy,structure:a.structure,reuse:a.reuse,text:a.text,platform:'自定义',author:'我分析的',plays:'',likes:'',fans:''});
  Store.set('hot_videos',videos);
  $('#hotAnalyzeInput').value='';$('#hotAnalyzeTitle').value='';$('#hotAnalyzeResult').innerHTML='';
  // 切到对应 tab 并刷新
  $$('.hot-tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===cat));
  renderHotVideoList();
  toast('已存入「'+HOT_CATS[cat]+'」案例库 📚');
}
function delHotVideo(id){
  if(!confirm('删除这条分析？'))return;
  let v=Store.get('hot_videos',[]);v=v.filter(x=>x.id!==id);Store.set('hot_videos',v);renderHotVideoList();
}

function addMyAnalysis(){
  const acc=prompt('哪个账号的视频？','@账号名')||'';if(!acc)return;
  const surface=prompt('Q1 表面在拍什么？','')||'';
  const logic=prompt('Q2 底层逻辑是什么？（拆掉内容外壳）','')||'';
  const relate=prompt('Q3 跟我的业务有什么关系？','')||'';
  const apply=prompt('Q4 我怎么套到我的人设里？','')||'';
  const list=Store.get('my_analysis',[]);
  list.push({id:uid(),acc,surface,logic,relate,apply,time:new Date().toLocaleDateString()});
  Store.set('my_analysis',list);renderMyAnalysis();toast('已拆解保存 ✅');

function renderMyAnalysis(){
  const list=$('#myAnalysisList');if(!list)return;
  const data=Store.get('my_analysis',[]);
  if(!data.length){list.innerHTML=`<div class="empty"><span class="icon">✏️</span>还没拆过，看到一个好视频就来拆一个</div>`;return;}
  list.innerHTML=data.slice().reverse().map(a=>`

        <div><b style="color:#92400E">Q1 表面：</b>${esc(a.surface)}</div>
        <div><b style="color:var(--primary-dark)">Q2 底层逻辑：</b>${esc(a.logic)}</div>

function delMyAnalysis(id){
  if(!confirm('删除这条拆解？'))return;

}

function renderCalendar(week){
  const body=$('#calendarBody');if(!body)return;

  const done=Store.get('launch_cal_done',{});

      <td>${d.a?`<div style="font-size:14px">${esc(d.a)}</div>${d.a?`<button class="btn btn-ghost btn-sm" style="margin-top:4px;padding:3px 8px;font-size:12px" onclick="toggleCalDone('${key}-a')">${done[key+'-a']?'✅ 已发':'标记已发'}</button>`:''}</div>`:'<span class="muted">—</span>'}</td>

const CHECKIN_SLOTS=[
  {slot:'早 9:00-11:00',type:'干货/价值输出',tip:'发一条有用的：费用明细/院校科普/申请流程/避坑提醒',icon:'☀️'},

];
function renderMomentsCheckin(){
  const today=todayStr();
  const done=Store.get('moments_checkin',{});
  const todayDone=done[today]||[false,false,false];
  const list=$('#momentsCheckin');if(!list)return;
  list.innerHTML=CHECKIN_SLOTS.map((s,i)=>`
    <div class="todo-item ${todayDone[i]?'done':''}" style="border-left:3px solid ${todayDone[i]?'var(--success)':'var(--accent)'}">
      <div class="checkbox ${todayDone[i]?'checked':''}" onclick="toggleCheckin(${i})"></div>
      <div class="todo-text">
        <b>${s.icon} ${s.slot}</b> · ${s.type}
        <div class="muted" style="font-size:13px;margin-top:2px">${s.tip}</div>
      </div>
    </div>
  `).join('');
  // 连续打卡天数
  const streak=calcCheckinStreak();
  const div=$('#momentsStreak');if(!div)return;
  const allDone=todayDone.every(x=>x);
  div.innerHTML=`
    <div class="flex-between">
      <span class="muted">连续完成天数：<b style="color:var(--accent);font-size:18px">🔥 ${streak}</b> 天</span>
      <span>${todayDone.filter(x=>x).length}/3 ${allDone?'<span class="pill green">今日已完成 ✅</span>':'<span class="pill orange">继续加油</span>'}</span>
    </div>
  `;
}
function toggleCheckin(i){
  const today=todayStr();
  const done=Store.get('moments_checkin',{});
  if(!done[today])done[today]=[false,false,false];
  done[today][i]=!done[today][i];
  Store.set('moments_checkin',done);
  renderMomentsCheckin();
}
function calcCheckinStreak(){
  const done=Store.get('moments_checkin',{});
  let streak=0;
  const d=new Date();
  while(true){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const t=done[ds];
    if(t&&t.every(x=>x)){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}

function renderMomentInspire(){
  const list=$('#momentInspireList');if(!list)return;
  const seed=Store.get('moments_inspire_seed',0);
  // 用种子选3条不重复的
  const picks=[];
  const used=new Set();
  for(let i=0;i<3;i++){
    let idx=(seed+i*7)%MOMENT_INSPIRES.length;
    while(used.has(idx)){idx=(idx+1)%MOMENT_INSPIRES.length;}
    used.add(idx);
    picks.push(MOMENT_INSPIRES[idx]);
  }
  list.innerHTML=picks.map((p,i)=>`

    </div>

function copySceneCopy(scene,i){
  const c=SCENE_COPIES[scene]?.[i];if(!c)return;

}

function addClient(){
  const name=prompt('客户昵称/备注：');if(!name)return;
  const level=prompt('等级（S=近期要成交 / A=在考虑 / B=刚加/沉默 / C=已成交/无需跟进）：','B')||'B';
  const source=prompt('来源（小红书/朋友圈/转介绍/其他）：','小红书')||'小红书';
  const lastDate=prompt('上次互动日期（如 0731）：',todayStr().slice(5).replace('-',''))||todayStr().slice(5).replace('-','');
  const nextAction=prompt('下一步动作（如：发案例/邀咨询电话/等回复）：','')||'';
  const clients=Store.get('clients',[]);
  clients.push({id:uid(),name,level:level.toUpperCase(),source,lastDate,nextAction});

      <div class="stat-box" style="background:linear-gradient(135deg,#DBEAFE,#BFDBFE)"><div class="stat-num" style="color:#1E40AF">${stats.B||0}</div><div class="stat-label">B 刚加/沉默</div></div>
      <div class="stat-box" style="background:linear-gradient(135deg,#D1FAE5,#A7F3D0)"><div class="stat-num" style="color:#065F46">${stats.C||0}</div><div class="stat-label">C 已成交</div></div>

function editClient(id){
  const clients=Store.get('clients',[]);const c=clients.find(x=>x.id===id);if(!c)return;
  const level=prompt('等级（S/A/B/C）：',c.level);if(!level)return;

  c.level=level.toUpperCase();c.nextAction=nextAction||'';c.lastDate=lastDate||c.lastDate;
  Store.set('clients',clients);renderClients();toast('已更新');

function delClient(id){

}

function drawBodyChart(canvas,data){
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.offsetWidth*2,H=canvas.height=360;
  ctx.scale(2,2);const w=W/2,h=H/2;
  ctx.clearRect(0,0,w,h);
  const padL=40,padR=20,padT=20,padB=40;
  const cw=w-padL-padR,ch=h-padT-padB;
  const vals=data.map(d=>d.weight);
  const minV=Math.min(...vals)-1,maxV=Math.max(...vals)+1;
  const range=maxV-minV||1;
  // 网格
  ctx.strokeStyle='#E2E8F0';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=padT+ch*i/4;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cw,y);ctx.stroke();
    ctx.fillStyle='#94A3B8';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText((maxV-range*i/4).toFixed(1),padL-6,y+3);
  }
  // 折线
  if(data.length>=1){
    const pts=data.map((d,i)=>{
      const x=data.length===1?padL+cw/2:padL+cw*i/(data.length-1);
      const y=padT+ch*(maxV-d.weight)/range;
      return {x,y,d};
    });
    // 填充
    ctx.beginPath();ctx.moveTo(pts[0].x,padT+ch);
    pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.lineTo(pts[pts.length-1].x,padT+ch);ctx.closePath();
    const g=ctx.createLinearGradient(0,padT,0,padT+ch);
    g.addColorStop(0,'rgba(20,184,166,.3)');g.addColorStop(1,'rgba(20,184,166,0)');
    ctx.fillStyle=g;ctx.fill();
    // 线
    ctx.beginPath();ctx.strokeStyle='#0EA5A4';ctx.lineWidth=2.5;ctx.lineJoin='round';
    pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
    // 点
    pts.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
      ctx.fillStyle='#0EA5A4';ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    });
    // 日期标签
    ctx.fillStyle='#94A3B8';ctx.font='9px sans-serif';ctx.textAlign='center';
    pts.forEach((p,i)=>{
      if(i%Math.max(1,Math.ceil(pts.length/6))===0||i===pts.length-1){
        ctx.fillText(p.d.date.slice(5),p.x,padT+ch+14);
      }
    });
    // 最新值标注
    const last=pts[pts.length-1];
    ctx.fillStyle='#0F2A3E';ctx.font='bold 11px sans-serif';
    ctx.fillText(last.d.weight+'kg',last.x,last.y-10);
  }
}

function ocrTraining(){
  // 创建文件选择器
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.capture='environment';
  input.onchange=async function(e){
    const file=e.target.files[0];if(!file)return;
    const status=$('#ocrStatus');
    status.innerHTML=`<div class="ocr-loading"><div class="spinner"></div><span>正在识别文字... 大约需要5-15秒</span></div>`;

    try{
      const worker=await Tesseract.createWorker('chi_sim',1,{
        logger:m=>{
          if(m.status==='recognizing text'){
            status.innerHTML=`<div class="ocr-loading"><div class="spinner"></div><span>识别中... ${Math.round(m.progress*100)}%</span></div>`;
          }
        }
      });
      const{data:{text}}=await worker.recognize(file);
      await worker.terminate();

      const cleaned=text.replace(/\n{3,}/g,'\n\n').trim();
      const ta=$('#trainContent');
      if(ta.value.trim()) ta.value+='\n\n---识别内容---\n'+cleaned;
      else ta.value=cleaned;

      status.innerHTML=`<div style="padding:10px;background:#D1FAE5;border-radius:8px;color:#065F46;font-size:14px">✅ 识别完成，共${cleaned.length}字，已填入内容框</div>`;
      setTimeout(()=>{if(status)status.innerHTML='';},4000);
    }catch(err){
      status.innerHTML=`<div style="padding:10px;background:#FEE2E2;border-radius:8px;color:#991B1B;font-size:14px">❌ 识别失败：${err.message}。建议换一张清晰度更高的图片</div>`;
    }
  };
  input.click();
}

function fileToTraining(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result;
    const ta=$('#trainContent');
    if(ta.value.trim()) ta.value+='\n\n---文件内容---\n'+text;
    else ta.value=text;
    toast('✅ 文件已读取，共'+text.length+'字');
  };
  reader.readAsText(file,'UTF-8');
  input.value='';
}

function analyzeTraining(text){
  const highlights=[];
  const flashcards=[];
  const lines=text.split(/\n/).filter(l=>l.trim());

  lines.forEach(line=>{
    const trimmed=line.trim();
    if(trimmed.length<4) return;

    // 检查每个规则
    TRAIN_RULES.highlight.forEach(rule=>{
      rule.kw.forEach(kw=>{
        if(trimmed.includes(kw)){
          // 避免重复添加同一行
          if(!highlights.find(h=>h.text===trimmed)){
            highlights.push({text:trimmed, tag:rule.tag, cls:rule.cls, icon:rule.icon});
          }
        }
      });
    });

    // 生成闪卡
    TRAIN_RULES.questionPatterns.forEach(pat=>{
      pat.kw.forEach(kw=>{
        if(trimmed.includes(kw)){
          // 避免重复
          const q=pat.template(trimmed);
          if(!flashcards.find(f=>f.q===q)){
            flashcards.push({id:uid(),q:q,a:trimmed,status:''});
          }
        }
      });
    });
  });

  // 如果没有自动识别到闪卡，把每个段落生成一个
  if(flashcards.length===0&&lines.length>0){
    lines.slice(0,5).forEach(line=>{
      if(line.trim().length>10){
        flashcards.push({id:uid(),q:`请复述以下内容：${line.trim().slice(0,40)}`,a:line.trim(),status:''});
      }
    });
  }

  return {highlights, flashcards};
}

function markCard(id,status){
  const trainings=Store.get('work_trainings',[]);
  trainings.forEach(t=>{
    if(t.flashcards){
      t.flashcards.forEach(fc=>{
        if(fc.id===id){
          fc.status=fc.status===status?'':status;
        }
      });
    }
  });
  Store.set('work_trainings',trainings);
  // 只更新这一张卡片
  trainings.forEach(t=>{
    if(t.flashcards){
      const fc=t.flashcards.find(f=>f.id===id);
      if(fc){
        const el=$('#fc-'+id);
        if(el){
          el.querySelector('.fc-status').innerHTML=`

            <button class="${fc.status==='unsure'?'active unsure':''}" onclick="markCard('${fc.id}','unsure')">❓ 没把握</button>
          `;
        }
      }
    }
  });
}

      </div>
      <input class="input" id="examTitle" placeholder="考核标题（如：第3季度业务考核-签证流程）" style="margin-bottom:8px">
      <textarea class="textarea" id="examContent" placeholder="考核中需要注意的内容...&#10;如：容易被问到的点、容易答错的细节、考核标准等" style="min-height:100px;margin-bottom:8px"></textarea>
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <select class="select" id="examImportance" style="flex:1">
          <option value="high">🔴 重要（必考）</option>
          <option value="mid">🟡 中等（可能考）</option>
          <option value="low">🔵 低（了解即可）</option>
        </select>
        <input class="input" id="examDate" type="date" style="flex:1" value="${todayStr()}">
      </div>
      <button class="btn btn-primary" onclick="addExam()" style="width:100%">添加</button>
    </div>
    <div id="examList"></div>
  `;
  renderExamList();
}

function addExam(){
  const title=$('#examTitle').value.trim();
  const content=$('#examContent').value.trim();
  const importance=$('#examImportance').value;
  const date=$('#examDate').value||todayStr();
  if(!title||!content){toast('⚠️ 标题和内容都要填');return;}

  const exams=Store.get('work_exams',[]);
  exams.unshift({id:uid(),title,content,date,importance,status:''});
  Store.set('work_exams',exams);
  $('#examTitle').value='';
  $('#examContent').value='';
  renderExamList();
  toast('✅ 已添加');
}

function renderExamList(){
  const list=$('#examList');if(!list)return;
  const exams=Store.get('work_exams',[]);
  if(!exams.length){
    list.innerHTML=`<div class="empty"><span class="icon">📋</span>还没有考核记录</div>`;
    return;
  }

  // 按日期排序（近期的在前）
  const sorted=exams.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const today=todayStr();

  list.innerHTML=sorted.map(e=>{
    const days=Math.ceil((new Date(e.date)-new Date(today))/86400000);
    let dateLabel=e.date;
    if(days===0) dateLabel='📅 今天';
    else if(days>0) dateLabel=`📅 ${e.date}（${days}天后）`;
    else dateLabel=`📅 ${e.date}（${-days}天前）`;

    const impMap={high:'🔴 重要',mid:'🟡 中等',low:'🔵 低'};
    const statusMap={'':'⬜ 未标记','mastered':'✅ 已掌握','review':'🔄 需复习','unsure':'❓ 没把握'};

    return `
      <div class="exam-item ${e.importance}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">
          <div style="flex:1">
            <div style="font-size:17px;font-weight:700">${esc(e.title)}</div>
            <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <span class="muted" style="font-size:13px">${dateLabel}</span>
              <span class="tag ${e.importance==='high'?'tag-hot':e.importance==='mid'?'tag-mid':'tag-low'}">${impMap[e.importance]}</span>
              <span class="muted" style="font-size:13px">${statusMap[e.status]}</span>
            </div>
          </div>
          <button class="btn-icon" onclick="delExam('${e.id}')">🗑</button>
        </div>
        <div style="font-size:15px;line-height:1.7;white-space:pre-wrap;padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:10px">${esc(e.content)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm ${e.status==='mastered'?'btn-primary':'btn-ghost'}" onclick="markExam('${e.id}','mastered')">✅ 已掌握</button>
          <button class="btn btn-sm ${e.status==='review'?'btn-primary':'btn-ghost'}" onclick="markExam('${e.id}','review')">🔄 需复习</button>
          <button class="btn btn-sm ${e.status==='unsure'?'btn-primary':'btn-ghost'}" onclick="markExam('${e.id}','unsure')">❓ 没把握</button>
        </div>
      </div>
    `;
  }).join('');
}

function markExam(id,status){
  let exams=Store.get('work_exams',[]);
  exams.forEach(e=>{
    if(e.id===id) e.status=e.status===status?'':status;
  });
  Store.set('work_exams',exams);
  renderExamList();
}

function delExam(id){
  if(!confirm('删除这条考核记录？'))return;
  let e=Store.get('work_exams',[]);
  e=e.filter(x=>x.id!==id);
  Store.set('work_exams',e);
  renderExamList();
  toast('已删除');
}

</script>
</body>
</html>
